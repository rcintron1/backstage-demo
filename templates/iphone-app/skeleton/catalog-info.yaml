apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name | dump }}
  description: ${{ values.description | dump }}
  annotations:
    local.path: ${{ values.name | dump }}
  tags:
    - ios
    - swiftui
    - mobile
spec:
  type: website
  lifecycle: experimental
  owner: ${{ values.owner | dump }}
  system: laptop-apps
